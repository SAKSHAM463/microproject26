<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MitShop Admin Dashboard</title>
  <style>
    :root {
      --primary: #4B35F5;
      --primary-hover: #3B27D8;
      --bg: #F4F3FB;
      --surface: #ffffff;
      --text: #15133D;
      --text-muted: #625F85;
      --border: #E0DDF0;
      --green-bg: #DDF6E8;
      --green-text: #12804A;
      --yellow-bg: #FFF0C2;
      --yellow-text: #8A5A00;
      --red-bg: #FFE1E3;
      --red-text: #C62E3B;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #loginView {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .login-card h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
      margin-top: 10px;
    }

    .error-msg {
      background-color: var(--red-bg);
      color: var(--red-text);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    /* Dashboard */
    #dashboardView {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      font-size: 20px;
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-pill {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-logout:hover {
      color: var(--red-text);
      border-color: var(--red-text);
    }

    .main-content {
      padding: 24px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      flex: 1;
    }

    .stat-card h3 {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .orders-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .orders-card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover td {
      background: #faf9fd;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-pending {
      background: var(--yellow-bg);
      color: var(--yellow-text);
    }

    .badge-completed {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .badge-cancelled {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .btn-action {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Access Check / Login View -->
  <div id="loginView">
    <div class="login-card">
      <h1>🛡 MitShop Admin</h1>
      <p id="loginNotice">Checking administrative session...</p>
      <div id="loginError" class="error-msg"></div>
      <a href="/" class="btn" id="loginActionBtn" style="display:none">Sign In on MitShop</a>
      <a href="/" class="btn btn-secondary">Return to Store</a>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboardView">
    <header class="navbar">
      <h1>MitShop Admin Dashboard</h1>
      <div class="nav-actions">
        <span class="admin-pill" id="adminUserPill">Admin</span>
        <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
      </div>
    </header>

    <main class="main-content">
      <div class="stats-row">
        <div class="stat-card">
          <h3>Total Orders</h3>
          <div class="value" id="totalOrdersCount">0</div>
        </div>
        <div class="stat-card">
          <h3>Pending Pickup</h3>
          <div class="value" id="pendingOrdersCount" style="color:var(--yellow-text)">0</div>
        </div>
        <div class="stat-card">
          <h3>Completed</h3>
          <div class="value" id="completedOrdersCount" style="color:var(--green-text)">0</div>
        </div>
      </div>

      <div class="orders-card">
        <div class="orders-card-header">
          <h2>Campus Marketplace Orders</h2>
          <span id="lastUpdated" style="font-size:13px;color:var(--text-muted)"></span>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Order #</th>
                <th>Time</th>
                <th>Item</th>
                <th>Buyer</th>
                <th>Seller</th>
                <th>Pickup Gate</th>
                <th>Hostel/Room</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr>
                <td colspan="11" style="text-align:center;padding:24px;color:var(--text-muted)">Loading orders...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    let autoRefreshTimer = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function checkAdminAuth() {
      const errBox = document.getElementById('loginError');
      const notice = document.getElementById('loginNotice');
      const actionBtn = document.getElementById('loginActionBtn');

      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) {
          notice.textContent = 'Admin access requires a signed-in college account listed in ADMIN_EMAILS.';
          actionBtn.style.display = 'block';
          return;
        }

        const user = await res.json();
        if (!user.is_admin) {
          notice.textContent = `Signed in as ${user.email}, but this account is not an authorized administrator.`;
          errBox.textContent = '403 Forbidden: Administrator credentials required.';
          errBox.style.display = 'block';
          actionBtn.style.display = 'block';
          return;
        }

        // Authorized admin!
        document.getElementById('adminUserPill').textContent = `Admin: ${user.name} (${user.email})`;
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'flex';

        fetchOrders();
        startAutoRefresh();
      } catch (err) {
        notice.textContent = 'Failed to verify session.';
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/admin/orders', { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to fetch admin orders');

        const orders = await res.json();
        renderOrders(orders);
        document.getElementById('lastUpdated').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error('Error fetching admin orders:', err);
      }
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--text-muted)">No orders found.</td></tr>';
        return;
      }

      let pending = 0;
      let completed = 0;

      tbody.innerHTML = orders.map(o => {
        if (o.status === 'Pending') pending++;
        if (o.status === 'Completed') completed++;

        const statusCls = `badge-${o.status.toLowerCase()}`;
        const timeStr = o.created_at ? new Date(o.created_at).toLocaleString() : '-';

        let actionHtml = '-';
        if (o.status === 'Pending') {
          actionHtml = `<button class="btn-action" onclick="fulfillOrder(${o.order_id})">✓ Fulfill</button>`;
        }

        return `
          <tr>
            <td><strong>#${o.order_id}</strong></td>
            <td style="font-size:12px;color:var(--text-muted)">${timeStr}</td>
            <td><strong>${escapeHtml(o.item_title)}</strong> (×${o.quantity || 1})</td>
            <td>${escapeHtml(o.buyer_name)}</td>
            <td>${escapeHtml(o.seller_name)}</td>
            <td>${escapeHtml(o.pickup_location)}</td>
            <td>${escapeHtml(o.hostel_room)}</td>
            <td><strong>₹${o.total}</strong></td>
            <td>${escapeHtml(o.payment_method)}</td>
            <td><span class="badge ${statusCls}">${o.status}</span></td>
            <td>${actionHtml}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('totalOrdersCount').textContent = orders.length;
      document.getElementById('pendingOrdersCount').textContent = pending;
      document.getElementById('completedOrdersCount').textContent = completed;
    }

    async function fulfillOrder(orderId) {
      try {
        const res = await fetch(`/api/admin/orders/${orderId}/fulfill`, {
          method: 'POST',
          credentials: 'include'
        });
        if (!res.ok) throw new Error('Fulfill action failed');
        fetchOrders();
      } catch (err) {
        alert(err.message);
      }
    }

    async function handleLogout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } catch {}
      window.location.href = '/';
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(fetchOrders, 30000);
    }

    document.addEventListener('DOMContentLoaded', checkAdminAuth);
  </script>
</body>
</html>
